# This repo's labels beyond standard/labels.yaml in giocaizzi/.github (see its docs/standard.md, Labels).
# Factory labels (docs/factory.md, Labels): the ticket-run contract and a runtime.
- {name: agent-ok, color: 0e8a16, description: "Approved for an agent run (owner only)"}
- {name: factory-claimed, color: 1d76db, description: "A factory run holds this ticket"}
- {name: needs-owner, color: d93f0b, description: "An agent question waits on the owner"}
