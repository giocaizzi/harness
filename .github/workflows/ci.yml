name: CI

# Every PR; `main` nightly and by hand (`gh workflow run ci.yml`) instead of on each merge, since a PR
# merges only up to date with `main` and green.
on:
  pull_request:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Every harness CLI on every OS against a scripted model (tests/e2e): installs, hooks, skills, agents.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Exact versions: an unpinned upstream release must not break CI overnight. Bump them in a PR of their own.
      E2E_CLIS: '@github/copilot@1.0.103 @openai/codex@0.163.0 opencode-ai@1.19.3 @earendil-works/pi-coding-agent@1.3.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # TEMPORARY probe (removed before merge): why the Windows install takes minutes.
      - name: probe windows npm install
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-MpComputerStatus | Select-Object AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, OnAccessProtectionEnabled, IsTamperProtected | Format-List
          Get-MpPreference | Select-Object DisableRealtimeMonitoring, ExclusionPath, ExclusionProcess | Format-List
          "cache: $(npm config get cache)"; "prefix: $(npm prefix -g)"; "root: $(npm root -g)"
          Get-Volume | Format-Table DriveLetter, FileSystem, Size, SizeRemaining
          $pkgs = '${{ env.E2E_CLIS }}' -split ' '
          function Timed($label) { foreach ($p in $pkgs) { $t = Measure-Command { npm install -g $p --no-audit --no-fund | Out-Null }; "{0} {1}: {2:N1}s" -f $label, $p, $t.TotalSeconds } }
          Timed 'defender-as-is'
          foreach ($p in $pkgs) { npm uninstall -g ($p -replace '@[^@]+$', '') | Out-Null }
          npm cache clean --force
          Set-MpPreference -DisableRealtimeMonitoring $true
          (Get-MpComputerStatus).RealTimeProtectionEnabled
          Timed 'realtime-off'
          foreach ($p in $pkgs) { npm uninstall -g ($p -replace '@[^@]+$', '') | Out-Null }
          npm cache clean --force
          Set-MpPreference -DisableRealtimeMonitoring $false
          $t = Measure-Command { npm install -g @pkgs --no-audit --no-fund | Out-Null }; "defender-as-is all-at-once: {0:N1}s" -f $t.TotalSeconds
      - run: npm install -g ${{ env.E2E_CLIS }}
      - run: node tests/e2e/run.mjs # `make e2e`; called directly because Windows runners have no make
        env:
          E2E_REQUIRE: 1

  # `make check` runs on Linux only (Windows runners have no make). The .ps1 scripts are Windows-only
  # and their tests skip elsewhere, so they run here.
  windows-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pwsh -NoProfile -File tests/host-hygiene.test.ps1
      # node passes a run whose tests all skipped or none matched: each step fails unless some test ran and none skipped.
      - shell: bash
        run: |
          node --test --test-reporter=tap tests/wait-pr-ps1.test.mjs | tee tap.txt
          if ! grep -q '^# pass [1-9]' tap.txt || ! grep -qx '# skipped 0' tap.txt; then echo "::error::no wait-pr.ps1 test ran, or one skipped"; exit 1; fi
      - shell: bash
        run: |
          node --test --test-reporter=tap --test-name-pattern='attended launcher \(ps1\)' tests/factory.test.mjs | tee tap.txt
          if ! grep -q '^# pass [1-9]' tap.txt || ! grep -qx '# skipped 0' tap.txt; then echo "::error::no attended launcher (ps1) test ran, or one skipped"; exit 1; fi

  make-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # guard plugin tests: node --test
      - run: npm install -g @anthropic-ai/claude-code@2.1.309 # validate.py runs `claude plugin validate`; pinned like the e2e CLIs
      - run: make check # PSScriptAnalyzer lints the .ps1 files here: the runner ships pwsh with it

  # Required status check, and only an aggregate: `if: always()` so a failed, cancelled or skipped
  # needed job fails `check` instead of skipping it (a skipped required check counts as passing).
  check:
    needs: [secrets, make-check, e2e, windows-scripts]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null || { echo "::error::a needed job did not succeed"; exit 1; }
