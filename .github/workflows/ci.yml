name: CI

# Every PR; `main` nightly and by hand (`gh workflow run ci.yml`) instead of on each merge, since a PR
# merges only up to date with `main` and green.
on:
  pull_request:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # every job is capped: a hung step would otherwise hold the run for 6 h
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Every harness CLI on every OS against a scripted model (tests/e2e): installs, hooks, skills, agents.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25 # 1-6 min measured (Windows: about 4, 6 on a cache miss)
    env:
      # Exact versions: an unpinned upstream release must not break CI overnight. Bump them in a PR of their own.
      E2E_CLIS: '@github/copilot@1.0.103 @openai/codex@0.163.0 opencode-ai@1.19.3 @earendil-works/pi-coding-agent@1.3.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Windows spends minutes writing the CLIs' files (pi's dependency tree most), not downloading them or in
      # Defender, whose real-time monitoring the runner already has off: restore the installed packages instead.
      # Each global package nests its own dependencies, and run.mjs starts each from its own entry point. The cache
      # paths come from E2E_CLIS, and the cache is saved right after a fresh install, before any CLI runs.
      - name: CLI paths (Windows)
        id: clis
        if: runner.os == 'Windows'
        shell: bash
        run: |
          prefix=$(npm prefix -g)
          prefix=${prefix//\\//} # C:/npm/prefix
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          { echo 'paths<<EOF'; for spec in $E2E_CLIS; do echo "$prefix/node_modules/${spec%@*}"; done; echo EOF; } >> "$GITHUB_OUTPUT"
      - name: Restore the CLIs (Windows)
        id: restore
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.clis.outputs.paths }}
          key: e2e-clis-${{ runner.os }}-node22-${{ env.E2E_CLIS }}
      - if: steps.restore.outputs.cache-hit != 'true'
        run: npm install -g ${{ env.E2E_CLIS }}
      - name: Save the CLIs (Windows)
        if: runner.os == 'Windows' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.clis.outputs.paths }}
          key: ${{ steps.restore.outputs.cache-primary-key }}
      - name: Check the restored CLIs' versions (Windows)
        if: steps.restore.outputs.cache-hit == 'true'
        shell: bash
        env:
          PREFIX: ${{ steps.clis.outputs.prefix }}
        run: |
          for spec in $E2E_CLIS; do
            name=${spec%@*} want=${spec##*@}
            got=$(node -p 'require(process.argv[1]).version' "$PREFIX/node_modules/$name/package.json")
            if [ "$got" != "$want" ]; then echo "::error::the cache restored $name $got, E2E_CLIS pins $want"; exit 1; fi
            echo "$name $got"
          done
      - run: node tests/e2e/run.mjs # `make e2e`; called directly because Windows runners have no make
        env:
          E2E_REQUIRE: 1

  # `make check` runs on Linux only (Windows runners have no make). The .ps1 scripts are Windows-only
  # and their tests skip elsewhere, so they run here.
  windows-scripts:
    runs-on: windows-latest
    timeout-minutes: 15 # about 2.5 min measured
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pwsh -NoProfile -File tests/host-hygiene.test.ps1
      # node passes a run whose tests all skipped, or where none matched (it then counts the file as one passing
      # test): each step expects its exact count, so a renamed or lost test, or a missing pwsh, fails it.
      - shell: bash
        run: |
          node --test --test-reporter=tap tests/wait-pr-ps1.test.mjs | tee tap.txt
          if ! grep -qx '# tests 14' tap.txt || ! grep -qx '# pass 14' tap.txt; then echo "::error::expected 14 wait-pr.ps1 tests to pass"; exit 1; fi
      - shell: bash
        run: |
          node --test --test-reporter=tap tests/land-scripts-ps1.test.mjs | tee tap.txt
          if ! grep -qx '# tests 22' tap.txt || ! grep -qx '# pass 22' tap.txt; then echo "::error::expected 22 land-many.ps1 and resync-after-squash.ps1 tests to pass"; exit 1; fi
      # The factory's ps1 launcher, and its result writer and checker (Node scripts that handle Windows paths and CRLF).
      - shell: bash
        run: |
          node --test --test-reporter=tap --test-name-pattern='^(attended launcher \(ps1\)|write-result|check-result|result scripts)' tests/factory.test.mjs | tee tap.txt
          if ! grep -qx '# tests 16' tap.txt || ! grep -qx '# pass 16' tap.txt; then echo "::error::expected 16 factory launcher (ps1), result writer and checker tests to pass"; exit 1; fi

  make-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # about 1.5 min measured
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install
      - uses: actions/setup-node@v7
        with:
          node-version: 22 # guard plugin tests: node --test
      - run: npm install -g @anthropic-ai/claude-code@2.1.309 # validate.py runs `claude plugin validate`; pinned like the e2e CLIs
      - run: make check # PSScriptAnalyzer lints the .ps1 files here: the runner ships pwsh with it

  # Required status check, and only an aggregate: `if: always()` so a failed, cancelled or skipped
  # needed job fails `check` instead of skipping it (a skipped required check counts as passing).
  check:
    needs: [secrets, make-check, e2e, windows-scripts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null || { echo "::error::a needed job did not succeed"; exit 1; }
