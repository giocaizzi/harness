schema_version: "1.0"
name: nextjs-post-page
description: The model loads nextjs when asked to add a dynamic route page.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Add a page at /posts/<slug> that shows the post from lib/posts.ts, and a 404 when the slug doesn't exist.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
