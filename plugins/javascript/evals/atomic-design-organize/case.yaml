schema_version: "1.0"
name: atomic-design-organize
description: The model loads atomic-design when asked to organize a flat components folder into a UI kit.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: src/components is a flat pile of files and nobody knows where a new component should go. Reorganize it into a proper structure.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
