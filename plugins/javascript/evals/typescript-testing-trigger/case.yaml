schema_version: "1.0"
name: typescript-testing-trigger
description: The model loads typescript-testing when asked to add tests for a TypeScript retry function that waits between attempts.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Add tests for retry in src/retry/retry.ts, including the delays between attempts and what happens when the signal is aborted.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
