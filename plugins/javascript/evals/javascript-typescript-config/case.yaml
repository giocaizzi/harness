schema_version: "1.0"
name: javascript-typescript-config
description: The model loads javascript-typescript when asked to add config loading and validation to a Node TypeScript service.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Add a loadConfig function that reads config.json, checks it has a port number and a database URL, and stops the service with a clear message when it doesn't.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
