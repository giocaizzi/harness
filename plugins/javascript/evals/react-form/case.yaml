schema_version: "1.0"
name: react-form
description: The model loads react when adding a validated form to a page.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Add a signup form with email and password validation to SignupPage."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
