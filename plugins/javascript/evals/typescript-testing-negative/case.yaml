schema_version: "1.0"
name: typescript-testing-negative
description: The model does not load typescript-testing for a TypeScript feature change that does not ask for tests.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Make retry give up immediately, without waiting, when fn throws a PermanentError, and rethrow that error as is.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
