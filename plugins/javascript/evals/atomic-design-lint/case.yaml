schema_version: "1.0"
name: atomic-design-lint
description: The model loads atomic-design when asked to enforce import boundaries between features and the UI kit with lint.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Add lint rules so a feature can't import from another feature, and nothing in src/ui can import from src/features.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
