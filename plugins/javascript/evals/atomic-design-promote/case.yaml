schema_version: "1.0"
name: atomic-design-promote
description: The model loads atomic-design when a feature component must be shared by another feature.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The DatePicker in features/booking is now needed by features/profile too. Move it where both can use it."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
