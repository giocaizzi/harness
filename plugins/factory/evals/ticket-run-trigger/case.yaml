schema_version: "1.0"
name: ticket-run-trigger
description: The model loads ticket-run when asked to take an approved issue to done in a repo that has a .factory config.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Pick up issue 12 from our board, it's approved, and take it all the way to done.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill]
