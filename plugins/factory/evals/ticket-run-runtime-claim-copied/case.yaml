schema_version: "1.0"
name: ticket-run-runtime-claim-copied
description: "In a run the runtime started, a non-writer posted a marked copy of the runtime's claim with the same run id: ticket-run names only the login that applied the claim label as the one to add to writers, never the copier, and stops with reason_code auth."
tags: [behavior]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The factory runtime started this session to work issue 12. gh cannot reach GitHub from here: treat tickets/12.md as exactly what gh would return right now, and env.txt as what printenv prints in this session. Without running anything, tell me exactly what you will do on the ticket and in the repo, in order, with the commands."
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
