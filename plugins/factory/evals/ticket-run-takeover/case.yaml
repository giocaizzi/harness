schema_version: "1.0"
name: ticket-run-takeover
description: On a ticket an approver handed over from a runtime, ticket-run waits for the runtime's claim to go, claims as attended, checks out the WIP branch from the runtime's log and removes the takeover label only after its claim.
tags: [behavior]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: I put factory-takeover on issue 12 so we finish attended what the runtime started. gh cannot reach GitHub from here, so the issue as it stands right now is in tickets/12.md. Without running anything, tell me exactly what you will do on the ticket and in the repo, in order, with the commands.
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]
