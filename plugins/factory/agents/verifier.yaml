# Overrides for the harnesses that do not read agents/verifier.md as-is (make build).
# Copilot: model left unset, it inherits the session model; its effort is set per agent in user settings
# (subagents.agents."factory:verifier".effortLevel), since Copilot agent files have no effort property.
copilot:
  tools:
    - read
    - search
    - execute
codex:
  model_reasoning_effort: medium
opencode:
  permission:
    edit: deny
