schema_version: "1.0"
name: docker-root
description: The model loads docker when a scan flags a container running as root.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The security scan says our container runs as root. Fix it."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
