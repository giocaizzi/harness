schema_version: "1.0"
name: kubernetes-rbac
description: The model loads kubernetes when a service account is over-privileged.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The worker's ServiceAccount has cluster-admin. Give it only what it needs: reading ConfigMaps in its own namespace."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
