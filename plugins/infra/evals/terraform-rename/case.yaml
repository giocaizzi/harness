schema_version: "1.0"
name: terraform-rename
description: The model loads terraform when asked to rename a resource without recreating it.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Rename the orders queue resource to orders_events without recreating it.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
