schema_version: "1.0"
name: terraform-import
description: The model loads terraform when a hand-made resource must be brought under config.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Someone created the DNS zone by hand in the console. Bring it under our config."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
