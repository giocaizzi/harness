schema_version: "1.0"
name: docker-smaller
description: The model loads docker when an oversized image must shrink.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Our image is 1.8 GB. Make it smaller."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
