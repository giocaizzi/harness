# Overrides for the harnesses that do not read agents/driver.md as-is (make build).
# Copilot: model left unset in the agent file; the dotfiles set it per agent under subagents.agents.
copilot:
  tools:
    - read
    - edit
    - execute
    - search
    # Copilot CLI's code-intelligence tool (registered as "lsp"); present when a language server is configured.
    - lsp
codex:
  model_reasoning_effort: medium
