# Overrides for the harnesses that do not read agents/scout.md as-is (make build).
# Copilot: model left unset, it inherits the session model; choose the tier with /model.
copilot:
  tools:
    - read
    - search
    - execute
codex:
  sandbox_mode: read-only
  model_reasoning_effort: low
opencode:
  permission:
    edit: deny
