# Overrides for the harnesses that do not read agents/scout.md as-is (make build).
# Copilot: model left unset in the agent file; the dotfiles set it per agent under subagents.agents.
copilot:
  tools:
    - read
    - search
    - execute
    # Copilot CLI's code-intelligence tool (registered as "lsp"); present when a language server is configured.
    - lsp
codex:
  # Ignored by Codex today: a subagent inherits the parent's sandbox (docs/compatibility.md). Kept for when it applies.
  sandbox_mode: read-only
  model_reasoning_effort: low
opencode:
  permission:
    edit: deny
