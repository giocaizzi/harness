schema_version: "1.0"
name: routing-design
description: A design request goes to the driver agent.
tags: [routing, routing-holdout]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Design a caching layer for the catalog service: what to cache, how entries get invalidated when prices and stock change, and where the cache lives. I want the design, not code."
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
