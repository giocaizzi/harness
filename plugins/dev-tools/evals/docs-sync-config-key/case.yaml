schema_version: "1.0"
name: docs-sync-config-key
description: "The model loads docs-sync when a config key is renamed and the docs mention it."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Rename the config key timeout to timeout_seconds in config.yaml and in the loader."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
