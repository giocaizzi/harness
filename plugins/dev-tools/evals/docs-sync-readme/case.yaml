schema_version: "1.0"
name: docs-sync-readme
description: "The model loads docs-sync when README install steps are out of date after a tooling change."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The install steps in the README are out of date: we use uv now, not pip. Fix them."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
