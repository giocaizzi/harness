schema_version: "1.0"
name: conventional-commits-breaking
description: "The model loads conventional-commits when a staged change removes a CLI flag."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Write the commit message for this change: it removes the --legacy flag from the CLI."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
