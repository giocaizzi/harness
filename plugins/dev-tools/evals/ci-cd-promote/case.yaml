schema_version: "1.0"
name: ci-cd-promote
description: "The model loads ci-cd when production should deploy the image that staging tested instead of a rebuild."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "azure-pipelines.yml builds the image once for staging and again for production. Change it so production gets exactly what we tested."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
