schema_version: "1.0"
name: release-please-config
description: "The model loads release-please when asked to edit its config."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "I want the next release to be 2.0.0 and the changelog to hide chore commits. Update the release config."
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
