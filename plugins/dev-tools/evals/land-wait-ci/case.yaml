schema_version: "1.0"
name: land-wait-ci
description: "The model loads land when asked to wait for CI on a PR and merge it."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Wait for CI on PR 9 and merge it once it is green. There is no network and no real GitHub here: the gh CLI is the stand-in script ./bin/gh, so run `export PATH=\"$PWD/bin:$PATH\"` before any gh command."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
