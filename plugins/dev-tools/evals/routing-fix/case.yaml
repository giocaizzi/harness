schema_version: "1.0"
name: routing-fix
description: A bug that needs a root cause goes to the driver agent, whatever the session model.
tags: [routing, routing-dev]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Users say the last page of search results is sometimes empty and sometimes repeats items from the page before. Find the root cause and fix it, with a test that would have caught it."
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
