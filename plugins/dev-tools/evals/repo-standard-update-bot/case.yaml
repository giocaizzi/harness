schema_version: "1.0"
name: repo-standard-update-bot
description: "The model loads repo-standard when dependencies need automatic updates."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The dependencies here are two years old. Set it up so they get updated automatically."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
