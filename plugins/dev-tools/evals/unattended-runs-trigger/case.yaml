schema_version: "1.0"
name: unattended-runs-trigger
description: The model loads unattended-runs when asked to prepare an overnight auto-approve run.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: I'm leaving for the night. Set claude up to work through TODO.md on its own with auto-approve so it never stalls waiting on me.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
