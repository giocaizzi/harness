schema_version: "1.0"
name: secrets-handling-leaked
description: "The model loads secrets-handling when a key was committed by accident."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "I committed the Stripe key in config.py last week by accident. Fix it."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
