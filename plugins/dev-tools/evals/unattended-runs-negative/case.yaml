schema_version: "1.0"
name: unattended-runs-negative
description: The model does not load unattended-runs for adding a confirmation-skipping flag to a CLI.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Add a --yes flag to the CLI's delete command so it skips the confirmation prompt."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
