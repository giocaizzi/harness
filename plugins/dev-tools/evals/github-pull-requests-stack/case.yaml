schema_version: "1.0"
name: github-pull-requests-stack
description: "The model loads github-pull-requests when a large change should be split into dependent PRs."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "My branch has 1500 lines of changes in one go. Split it into a few PRs that build on each other. There is no network and no real GitHub here: the gh CLI is the stand-in script ./bin/gh, so run `export PATH=\"$PWD/bin:$PATH\"` before any gh command."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
