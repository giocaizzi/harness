schema_version: "1.0"
name: ship-draft-first-push
description: "ship pushes the commit and opens the PR as a draft on the first push."
tags: [behavior]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Commit this change and put it up for review. There is no network and no real GitHub here: the gh CLI is the stand-in script ./bin/gh, so run `export PATH=\"$PWD/bin:$PATH\"` before any gh command."
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
