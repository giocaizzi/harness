schema_version: "1.0"
name: vault-organization-trigger
description: "The model loads vault-organization when asked to tidy the naming of machine secrets in a password vault."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "My Bitwarden vault is a mess: tokens and SSH keys named five different ways, half of them unfiled. Plan a naming scheme and folder layout for the machine secrets, using vault-export.json."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
