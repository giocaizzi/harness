schema_version: "1.0"
name: pr-fix-trigger
description: "The model loads pr-fix when asked to address review comments on a PR."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Reviewers left comments on my PR. Please address the review comments and push the fixes."
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
