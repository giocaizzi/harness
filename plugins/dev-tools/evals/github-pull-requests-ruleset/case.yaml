schema_version: "1.0"
name: github-pull-requests-ruleset
description: "The model loads github-pull-requests when main must refuse merges whose CI has not passed."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "People keep merging PRs into main while CI is still red. Make GitHub refuse the merge until the check job passes."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
