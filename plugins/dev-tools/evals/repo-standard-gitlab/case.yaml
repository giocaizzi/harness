schema_version: "1.0"
name: repo-standard-gitlab
description: "The model loads repo-standard when a GitLab project must follow the repo baseline."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Set this GitLab project up like our GitHub ones: one required check, squash merges and an MR title check."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
