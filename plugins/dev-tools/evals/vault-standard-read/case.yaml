schema_version: "1.0"
name: vault-standard-read
description: "The model loads vault-standard when a task needs to read a credential from a password vault."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The deploy script in this repo needs the Cloudflare API token for the staging account. Get it from my Bitwarden vault and wire it into the script without printing it. The vault item names are listed in vault-export.json."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
