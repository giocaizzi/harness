schema_version: "1.0"
name: github-actions-fix-red
description: "The model loads github-actions when a workflow step fails with a token permission error."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The PR comment step fails with 'Resource not accessible by integration' and the check is red. Fix it."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
