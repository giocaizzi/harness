schema_version: "1.0"
name: github-pull-requests-trigger
description: "The model loads github-pull-requests when asked to split a branch into stacked PRs."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "This branch mixes a refactor and a new feature. Split it into stacked PRs so each part is reviewed and merged on its own."
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill]
