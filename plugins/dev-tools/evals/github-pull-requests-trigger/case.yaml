schema_version: "1.0"
name: github-pull-requests-trigger
description: "The model loads github-pull-requests when asked to save unpushed work on a branch to GitHub."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Save my work on this branch to GitHub so it is backed up."
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill]
