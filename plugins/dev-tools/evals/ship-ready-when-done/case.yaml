schema_version: "1.0"
name: ship-ready-when-done
description: "ship runs the check, marks the finished draft PR ready and corrects a PR title that no longer matches the work."
tags: [behavior]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The work on this branch is finished and already pushed. Take its draft PR to ready for review. There is no network and no real GitHub here: the gh CLI is the stand-in script ./bin/gh, so run `export PATH=\"$PWD/bin:$PATH\"` before any gh command."
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
