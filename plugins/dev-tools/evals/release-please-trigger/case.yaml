schema_version: "1.0"
name: release-please-trigger
description: "The model loads release-please when asked to cut a release in a repo configured with it."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "We want to ship the next version of acme-app. What do I have to do to cut the release?"
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
