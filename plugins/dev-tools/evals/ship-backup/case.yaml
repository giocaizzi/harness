schema_version: "1.0"
name: ship-backup
description: The model loads ship when asked to push work somewhere safe.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Push my work somewhere safe, I'm switching laptops. There is no network and no real GitHub here: the gh CLI is the stand-in script ./bin/gh, so run `export PATH=\"$PWD/bin:$PATH\"` before any gh command."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
