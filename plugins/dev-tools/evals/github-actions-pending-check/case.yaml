schema_version: "1.0"
name: github-actions-pending-check
description: "The model loads github-actions when a required check stays pending on docs-only PRs."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "On PRs that only touch docs, the required check sits on 'Expected - Waiting for status to be reported' forever. Fix it."
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
