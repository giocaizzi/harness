schema_version: "1.0"
name: land-verify
description: "The model loads land when asked to check that a merged PR works on main."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "PR 21 merged an hour ago. Check the change actually works on main. There is no network and no real GitHub here: the gh CLI is the stand-in script ./bin/gh, so run `export PATH=\"$PWD/bin:$PATH\"` before any gh command."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
