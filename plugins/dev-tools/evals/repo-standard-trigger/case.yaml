schema_version: "1.0"
name: repo-standard-trigger
description: "The model loads repo-standard when asked to audit a repo against a baseline."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Audit this repo: what is missing compared to what every repository should have?"
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
