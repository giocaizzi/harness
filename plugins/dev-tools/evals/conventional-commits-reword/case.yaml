schema_version: "1.0"
name: conventional-commits-reword
description: "The model loads conventional-commits when the last commit message is useless and needs rewriting."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The last commit just says 'fixed stuff'. Give it a proper message."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
