schema_version: "1.0"
name: pr-fix-requested-changes
description: "The model loads pr-fix when a PR came back with changes requested."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "PR 8 came back with 'changes requested'. Handle it. There is no network and no real GitHub here: the gh CLI is the stand-in script ./bin/gh, so run `export PATH=\"$PWD/bin:$PATH\"` before any gh command."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
