schema_version: "1.0"
name: host-hygiene-trigger
description: "The model loads host-hygiene when a repo has piled up old worktrees and branches."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "This repo has hundreds of old worktrees and branches that agents left behind. Clean it up."
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill]
