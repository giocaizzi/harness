schema_version: "1.0"
name: vault-standard-negative
description: "The model does not load vault-standard for reading an environment variable in application code."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Make config.py read the DATABASE_URL environment variable and fall back to sqlite when it is unset."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
