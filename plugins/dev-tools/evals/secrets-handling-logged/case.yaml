schema_version: "1.0"
name: secrets-handling-logged
description: "The model loads secrets-handling when a service logs a connection string with its password."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "At startup our service prints the database URL, password included. Stop that."
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
