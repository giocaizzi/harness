schema_version: "1.0"
name: unattended-runs-stalled
description: The model loads unattended-runs when an overnight agent stalled on a permission prompt.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "My overnight agent sat for six hours on a 'Do you want to proceed?' prompt. Make sure that doesn't happen again."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
