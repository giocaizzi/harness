schema_version: "1.0"
name: routing-plan
description: A design and rollout plan goes to the driver agent, whatever the session model.
tags: [routing, routing-dev]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Before anyone touches code, I need a design and a rollout plan for moving every service under services/ off legacy_log onto the standard logging module, with structured fields and a way to roll back per service. Get it planned properly and give me the plan."
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
