schema_version: "1.0"
name: repo-standard-setup
description: "The model loads repo-standard when asked to set up CI and protections on a new repo."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "I just created this repo. Set it up properly: CI, PR title check, secret scan and branch protection."
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
