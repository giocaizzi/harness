schema_version: "1.0"
name: repo-standard-task-runner
description: "The model loads repo-standard when a repo needs one standard way to run lint and test."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Everyone runs different commands to lint and test this repo. Give it one standard way to run them."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
