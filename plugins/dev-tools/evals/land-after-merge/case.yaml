schema_version: "1.0"
name: land-after-merge
description: "The model loads land when a PR just merged and the local branch needs cleaning up."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "My PR just got merged. Sync main and get rid of the branch. There is no network and no real GitHub here: the gh CLI is the stand-in script ./bin/gh, so run `export PATH=\"$PWD/bin:$PATH\"` before any gh command."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
