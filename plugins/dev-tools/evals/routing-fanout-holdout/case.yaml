schema_version: "1.0"
name: routing-fanout-holdout
description: Input validation across three handler modules goes to the driver, which fans the per-module edits out to workers.
tags: [routing, routing-holdout, routing-shape]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The users, orders and invoices handlers in api/handlers/ accept any payload. Add input validation to each (required fields, types, a 400 with the list of problems), keeping each handler's validation in its own module, plus tests per handler. Give it to the driver to plan and implement. This run is unattended, so take cheap-to-undo choices as assumptions and list them in your answer."
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash, Edit, Write]
