schema_version: "1.0"
name: routing-lookup
description: A lookup that follows call chains across modules goes to the scout agent.
tags: [routing, routing-dev]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Which HTTP handlers under app/web reach the database, directly or through other modules? For each, give the call chain down to app/infra/db.py with file:line. Just the list."
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
