schema_version: "1.0"
name: wt-parallel
description: The model loads wt when asked to start a second task without touching current changes.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "I'm in the middle of something on this branch, but I need to start the logging fix alongside it without touching my changes."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
