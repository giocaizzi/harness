schema_version: "1.0"
name: docs-sync-new-flag
description: "The model loads docs-sync when a new script flag is documented in docs/."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Add a --dry-run flag to scripts/deploy.sh that prints the commands instead of running them."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
