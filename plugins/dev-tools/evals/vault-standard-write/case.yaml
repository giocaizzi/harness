schema_version: "1.0"
name: vault-standard-write
description: "The model loads vault-standard when a task adds or renames a multi-part credential in a secret store."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "I just generated a new service account key file plus its client id and client secret for the acme project. Tell me what to call the secrets and how to store them in Google Secret Manager. Existing secret names are in vault-export.json."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
