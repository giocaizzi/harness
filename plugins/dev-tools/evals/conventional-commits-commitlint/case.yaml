schema_version: "1.0"
name: conventional-commits-commitlint
description: "The model loads conventional-commits when a commit-msg hook rejects a message and the user asks what it should look like."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The commit-msg hook rejects my commit with 'subject may not be empty, type may not be empty'. What should the message look like?"
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
