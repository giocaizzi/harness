schema_version: "1.0"
name: routing-review-safety-holdout
description: A review of a large refactor of the billing pipeline (a core process, many files) raises the reviewer to Opus at effort high on the spawn.
tags: [routing, routing-holdout, routing-shape]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Get the change on branch refactor/billing-pipeline reviewed against main before I merge it, and write the verdict to review.md in the repo root. Do not fix anything yet."
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Bash, Edit, Write]
