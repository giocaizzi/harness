schema_version: "1.0"
name: github-pull-requests-merge-queue
description: "The model loads github-pull-requests when two green PRs broke main together."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Two PRs passed CI on their own, merged, and broke main together. Set the repo up so that can't happen again."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
