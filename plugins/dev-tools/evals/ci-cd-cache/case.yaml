schema_version: "1.0"
name: ci-cd-cache
description: "The model loads ci-cd when a Buildkite build re-downloads npm dependencies on every run."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Every Buildkite build downloads all the npm dependencies again. Make it stop."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
