schema_version: "1.0"
name: pr-fix-ci-failure
description: "The model loads pr-fix when asked to fix failing CI on a PR."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "CI is red on my PR and I do not know why. Fix the failing checks and push."
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
