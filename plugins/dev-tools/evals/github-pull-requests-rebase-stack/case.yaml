schema_version: "1.0"
name: github-pull-requests-rebase-stack
description: "The model loads github-pull-requests when the bottom PR of a stack merged and the PRs above need updating."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The bottom PR of my stack just merged. Update the two PRs above it. There is no network and no real GitHub here: the gh CLI is the stand-in script ./bin/gh, so run `export PATH=\"$PWD/bin:$PATH\"` before any gh command."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
