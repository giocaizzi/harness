schema_version: "1.0"
name: pr-fix-single-comment
description: "The model loads pr-fix when a reviewer comment on a PR needs fixing."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The reviewer says the error message on line 40 of api.py is unclear. Fix it on the PR. There is no network and no real GitHub here: the gh CLI is the stand-in script ./bin/gh, so run `export PATH=\"$PWD/bin:$PATH\"` before any gh command."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
