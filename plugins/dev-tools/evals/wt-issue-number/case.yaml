schema_version: "1.0"
name: wt-issue-number
description: The model loads wt when asked to pick up an issue by number.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Pick up #57. There is no network and no real GitHub here: the gh CLI is the stand-in script ./bin/gh, so run `export PATH=\"$PWD/bin:$PATH\"` before any gh command."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
