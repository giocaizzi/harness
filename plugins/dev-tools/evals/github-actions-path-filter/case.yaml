schema_version: "1.0"
name: github-actions-path-filter
description: "The model loads github-actions when tests for one directory should only run when that directory changes."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The api tests run on every PR, even ones that only change web/. Only run them when api/ changes."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
