schema_version: "1.0"
name: vault-organization-github-apps
description: "The model loads vault-organization when GitHub App keys in a vault have no metadata and inconsistent names."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "I renamed a GitHub App and now I can't tell which vault item is which App. How should the App keys and ids be stored in the vault so this doesn't happen again? The current item names are listed in vault-export.json."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
