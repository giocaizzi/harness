schema_version: "1.0"
name: worker-isolated-branch
description: "A worker in a harness-made worktree renames the branch it was given to the brief's and starts from the brief's base, without a second branch."
tags: [behavior]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "You are acting as the dev-tools worker, in a worktree the harness made for you on branch worktree-agent-a1b2c3. Brief: your branch is unit/u1-notes and your base is feat/notes-base. Add a file NOTES.md containing the line `notes` and commit it. Do not push."
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
