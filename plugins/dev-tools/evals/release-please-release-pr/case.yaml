schema_version: "1.0"
name: release-please-release-pr
description: "The model loads release-please when the Release PR proposes the wrong version."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The Release PR wants to bump to 1.4.0, but this should only be 1.3.2. Fix that."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
