schema_version: "1.0"
name: host-hygiene-slow-machine
description: "The model loads host-hygiene when the machine is slow and the user asks what is using it."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Everything is crawling and the load average is 40. What is eating the machine and what should I stop?"
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
