schema_version: "1.0"
name: standup-needs-you
description: The standup report opens with a short story, then a numbered Needs you list the user can approve with one reply.
tags: [behavior]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /standup The state of this session is in STATE.md; use it instead of running commands. Give me the report.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill]
