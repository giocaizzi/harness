schema_version: "1.0"
name: unattended-runs-bypass
description: The model loads unattended-runs when asked to start an auto-approve agent while the user is away.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Start claude with --dangerously-skip-permissions on this repo and let it fix all the lint errors while I'm in meetings."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
