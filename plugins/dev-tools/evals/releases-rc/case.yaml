schema_version: "1.0"
name: releases-rc
description: "The model loads releases when asked for a release candidate before a final release."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Put out a release candidate of 3.0 so testers can try it before the final."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
