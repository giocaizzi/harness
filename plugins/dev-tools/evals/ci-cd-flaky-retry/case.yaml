schema_version: "1.0"
name: ci-cd-flaky-retry
description: "The model loads ci-cd when integration tests fail at random in a Jenkins pipeline and people just rebuild."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The integration tests in our Jenkins pipeline fail at random about once a day and people just hit rebuild. Fix this properly."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
