schema_version: "1.0"
name: vault-organization-write
description: "The model loads vault-organization when a task adds or renames a multi-part credential in a password vault."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "I just generated a new service account key file plus its client id and client secret for the acme project. Tell me how to store them in my Bitwarden vault, with what name and in which folder. Existing item names are in vault-export.json."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
