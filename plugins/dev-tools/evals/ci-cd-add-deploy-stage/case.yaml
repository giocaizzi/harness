schema_version: "1.0"
name: ci-cd-add-deploy-stage
description: "The model loads ci-cd when adding a gated production deploy to a GitLab pipeline."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Add a production deploy to .gitlab-ci.yml that runs after staging, only from main, behind a manual approval."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
