schema_version: "1.0"
name: sqlalchemy-negative
description: "The model does not load sqlalchemy for a FastAPI route with no database."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Add a GET /ping route to the app that returns the string pong."
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
