schema_version: "1.0"
name: sqlalchemy-async
description: The model loads sqlalchemy when moving a sync repository layer to the async engine.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Switch the repository layer to the async engine; the app is moving to asyncio."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
