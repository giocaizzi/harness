schema_version: "1.0"
name: fastapi-settings
description: The model loads fastapi when moving configuration into environment settings.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Move the database URL and the debug flag out of the code into settings read from the environment."
  max_turns: 8
