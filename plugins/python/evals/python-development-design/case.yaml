schema_version: "1.0"
name: python-development-design
description: Adding a second notification channel stays concrete and Google-style, with no single-implementation base class or factory and no relative imports.
tags: [behavior]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Alerts only go to Slack today. Add email as a second channel (SMTP host, port and sender come from the environment, like the webhook does), and send each alert to both.
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
