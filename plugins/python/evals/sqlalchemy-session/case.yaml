schema_version: "1.0"
name: sqlalchemy-session
description: "The model loads sqlalchemy when asked to handle sessions and transactions."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Add a helper that creates a user and an order in one transaction and rolls back if either insert fails."
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
