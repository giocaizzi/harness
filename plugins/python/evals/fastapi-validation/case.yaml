schema_version: "1.0"
name: fastapi-validation
description: The model loads fastapi when request validation is missing on an endpoint.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "POST /orders accepts negative quantities. Reject them with a clear error."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
