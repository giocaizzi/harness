schema_version: "1.0"
name: sqlalchemy-migration
description: The model loads sqlalchemy when adding a column with an Alembic migration.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Add a nullable archived_at column to users, with a migration."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
