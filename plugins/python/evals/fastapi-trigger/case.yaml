schema_version: "1.0"
name: fastapi-trigger
description: "The model loads fastapi when asked to add a route to a FastAPI app."
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Add a POST /items endpoint to this API that takes a name and a price and returns the created item."
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
