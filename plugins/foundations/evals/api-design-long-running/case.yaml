schema_version: "1.0"
name: api-design-long-running
description: The model loads api-design when a slow synchronous endpoint makes clients time out.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "POST /reports takes two minutes and clients time out. Fix the endpoint."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
