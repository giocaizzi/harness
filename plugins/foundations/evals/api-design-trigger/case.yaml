schema_version: "1.0"
name: api-design-trigger
description: The model loads api-design when asked to add a list endpoint over a collection that can grow.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Add an endpoint listing a customer's invoices; there can be thousands.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
