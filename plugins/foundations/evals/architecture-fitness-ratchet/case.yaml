schema_version: "1.0"
name: architecture-fitness-ratchet
description: The model loads architecture-fitness when a lint backlog must stop growing without being fixed now.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: We have 140 lint warnings. We can't fix them now, but no new ones.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
