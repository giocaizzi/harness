schema_version: "1.0"
name: system-design-adr
description: The model loads system-design when asked to write up a technology choice for the team to decide.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "We need to choose between Kafka and SQS for order events. Write it up so the team can decide."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
