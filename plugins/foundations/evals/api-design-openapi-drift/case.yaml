schema_version: "1.0"
name: api-design-openapi-drift
description: The model loads api-design when the OpenAPI document no longer matches the API and must be kept in sync.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "openapi.yaml no longer matches what the API returns. Fix it and keep it from drifting again."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
