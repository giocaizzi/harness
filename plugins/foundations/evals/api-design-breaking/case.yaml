schema_version: "1.0"
name: api-design-breaking
description: The model loads api-design when a field rename may break existing API clients.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Rename the qty field to quantity in the order response. The mobile app reads it."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
