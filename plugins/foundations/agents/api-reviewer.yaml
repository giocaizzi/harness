# Overrides for the harnesses that do not read agents/api-reviewer.md as-is (make build).
# Copilot: model left unset in the agent file; the dotfiles set it per agent under subagents.agents.
copilot:
  name: "API Reviewer"
  argument-hint: "API Security Review"
  tools:
    - read
    - edit
    - search
    - execute
    - web
    - skill
    - ms-python.python/getPythonEnvironmentInfo
    - ms-python.python/getPythonExecutableCommand
codex:
  model_reasoning_effort: medium
