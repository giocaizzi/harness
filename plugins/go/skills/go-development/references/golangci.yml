# golangci-lint v2 baseline (checked with v2.15): every linter on, then opt out with a reason.
# It enforces the Google Go Style Guide where a linter can; SKILL.md lists the rules left to review.
# Copy to the repo root as .golangci.yml. Pinned through golangci-lint.mod (see PROJECT_SETUP.md),
# so a golangci-lint upgrade that adds linters lands in its own PR.
version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod
  build-tags:
    - integration   # lint the integration tests too (go-testing)

linters:
  default: all
  disable:
    # Deprecated upstream; their _v5 / _v2 successors are covered below or by `default: all`.
    - exhaustruct
    - gomodguard
    - wsl
    # Zero values are idiomatic; forcing every field in every literal fights that.
    - exhaustruct_v5
    # Whitespace and naming taste, not correctness.
    - wsl_v5
    - nlreturn
    - varnamelen
    - lll                # Google sets no line length limit
    - noinlineerr        # `if err := f(); err != nil` is idiomatic
    - nonamedreturns     # named results document multi-value returns; nakedret still bans bare returns
    # To-do comments are tracked (as issues, by CI), not lint errors.
    - godox
    # Dynamic errors with context (fmt.Errorf("open %s: %w", ...)) are the norm; sentinels only where callers branch.
    - err113
    # White-box tests in the same package are allowed; black-box (_test package) where the API is the subject.
    - testpackage
    # Struct tags follow the external format they map (an API's snake_case JSON), not a house case.
    - tagliatelle
    # Numbers in tests and table data are clearer inline; named constants where a value has meaning.
    - mnd
    # gocognit covers complexity; these overlap with it or count lines rather than difficulty.
    - cyclop
    - gocyclo
    - funlen
    - maintidx

  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
      disable:
        - fieldalignment   # memory layout tuning, not correctness; enable per hot struct
    gocognit:
      min-complexity: 20
    nakedret:
      max-func-lines: 0
    sloglint:
      kv-only: false
      attr-only: true
      no-global: all
      context: scope
      static-msg: true
      key-naming-case: snake
    wrapcheck:
      ignore-sig-regexps:
        - \.Errorf\(
        - errors\.New\(
        - errors\.Join\(
        - \.Wait\(\)        # errgroup.Group.Wait returns the goroutines' own (already wrapped) errors
    gosec:
      excludes:
        - G204   # subprocess launched with variable: a process supervisor does this on purpose
    depguard:
      rules:
        house:
          # No allow list: everything not denied is allowed. Add a repo's own bans here.
          deny:
            - pkg: github.com/stretchr/testify
              desc: no assertion libraries (Google decisions); use the testing package and go-cmp
            - pkg: github.com/golang/mock
              desc: hand-written fakes, not generated mocks (go-testing)
            - pkg: go.uber.org/mock
              desc: hand-written fakes, not generated mocks (go-testing)
            - pkg: github.com/pkg/errors
              desc: use the standard errors package and fmt.Errorf with %w
    nolintlint:
      require-explanation: true   # //nolint:<linter> // reason
      require-specific: true
    staticcheck:
      # Default checks. Its naming and doc-comment checks (ST1000, ST1003, ST1016, ST1020-22) stay off:
      # revive's rules below report the same Google rules once.
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
    revive:
      # Listing a rule turns revive's defaults (golint's checks: var-naming initialisms, exported doc
      # comments and stutter, receiver-naming, error-strings, indent-error-flow, unexported-return,
      # context-as-argument, context-keys-type, blank and dot imports, ...) off unless this is set.
      enable-default-rules: true
      rules:
        # Google naming and imports beyond golint.
        - name: package-naming          # no util/common/types, no top-level pkg/, no std name clash
          arguments:
            - check-extra-bad-name: true   # helpers, models, shared, utilities, api, ...
              user-defined-bad-names: [helper, handlers, controllers, services, repositories, managers]
        - name: package-directory-mismatch
        - name: import-shadowing        # a variable named like an imported package
        - name: redundant-import-alias
        - name: import-alias-naming     # lowercase, no underscores
        - name: deep-exit               # os.Exit and log.Fatal only in main (main/run)
        - name: use-any
    paralleltest:
      ignore-missing-subtests: true
    usetesting:
      os-temp-dir: true

  exclusions:
    generated: strict
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gochecknoglobals   # golden-file flags and test tables
          - wrapcheck
          - gosec
          - dupl
          - goconst

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gofumpt:
      extra:
        group-params: true
    gci:
      sections:
        - standard
        - default
        - localmodule
