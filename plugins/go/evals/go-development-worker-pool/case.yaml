schema_version: "1.0"
name: go-development-worker-pool
description: The model loads go-development when asked to process items concurrently with a bounded pool.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Make Process handle the items concurrently, at most 4 at a time, and stop at the first error.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
