schema_version: "1.0"
name: go-testing-trigger
description: The model loads go-testing when asked to add tests for a Go retry function that sleeps between attempts.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Add tests for Retry, including the delays between attempts.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
