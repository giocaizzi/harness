schema_version: "1.0"
name: go-development-design
description: Adding a second storage backend declares a small interface in the consuming package, with no factory type or pkg/ tree.
tags: [behavior]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Add a second storage backend that keeps reports in memory, so the reporter can run without a disk. Choose it with a -store=memory flag; the file store stays the default.
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
