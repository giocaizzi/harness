schema_version: "1.0"
name: go-development-lint
description: The model loads go-development when a module has no linter configured.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Set up the linter for this module and fix what it reports."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill, Bash]
