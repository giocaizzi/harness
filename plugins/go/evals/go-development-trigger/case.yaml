schema_version: "1.0"
name: go-development-trigger
description: The model loads go-development while adding a timeout and process-group kill to a Go command runner.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Make Run stop the command after a timeout, and kill anything the command spawned too, not just the command itself.
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
