schema_version: "1.0"
name: go-development-release
description: The model loads go-development when binaries must be cross-built and attached to releases.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Build the CLI for Linux, macOS and Windows and attach the binaries to each GitHub release."
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
